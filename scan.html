<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFD600">
<title>Tool scan | TCS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f4f2;color:#111}
.top{background:#FFD600;border-bottom:4px solid #111;padding:14px 16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px}
.card{background:#fff;border:1px solid #ddd;border-top:8px solid #bbb;border-radius:10px;padding:28px 20px;text-align:center}
.card.ok{border-top-color:#1f9d55}.card.bad{border-top-color:#d62828}.card.wait{border-top-color:#FFD600}
.icon{font-size:64px;line-height:1;margin-bottom:6px}
.ok .icon{color:#1f9d55}.bad .icon{color:#d62828}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:.02em}
.ok h1{color:#1f9d55}.bad h1{color:#d62828}
.name{font-size:22px;font-weight:800;margin:14px 0 4px}
.code{font:700 16px monospace;color:#555;letter-spacing:.06em}
.meta{margin-top:16px;font-size:14px;color:#444;line-height:1.6}
.rows{margin:20px 0 0;text-align:left;border-top:1px solid #eee}
.row{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid #eee;font-size:15px}
.row b{color:#1f9d55;font-size:20px}
.btn{display:inline-block;margin-top:18px;background:#111;color:#fff;border:0;border-radius:8px;padding:13px 22px;font-size:16px;font-weight:700}
.small{margin-top:14px;font-size:12px;color:#777}
</style>
</head>
<body>
<div class="top">KLB / MSG &middot; Tool check-out</div>
<div class="wrap"><div id="box" class="card wait"><div class="icon">&#8987;</div><h1>Checking tool&hellip;</h1></div></div>
<script>
(function(){
  var KEY="klb-ops-state-v2",box=document.getElementById("box"),q=new URLSearchParams(location.search);
  var tool=q.get("tool")||q.get("code"),special=q.get("special"),part=q.get("part");
  var esc=function(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var DIV={klb:"KLB - Modimolle",msg:"MSG - Polokwane"};
  function show(cls,icon,title,body){box.className="card "+cls;box.innerHTML='<div class="icon">'+icon+'</div><h1>'+title+'</h1>'+(body||"")}
  // Special tools and parts keep their full screens in the main app.
  if(special){location.replace("/3_Operations_Officer_Page.html?special="+encodeURIComponent(special));return}
  if(part){location.replace("/3_Operations_Officer_Page.html?part="+encodeURIComponent(part));return}
  if(!tool){show("bad","&#10005;","No tool code","<p class='meta'>This link has no tool code. Scan the sticker on the tool again.</p>");return}
  function run(){
    show("wait","&#8987;","Checking tool&hellip;","<div class='code'>"+esc(tool)+"</div>");
    fetch("/api/kv?key="+KEY+"&op=checkout&code="+encodeURIComponent(tool),{method:"POST",cache:"no-store"})
      .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
      .then(function(x){
        if(x.s===404){show("bad","&#10005;","Unknown tool","<div class='code'>"+esc(tool)+"</div><p class='meta'>This tool is not on the register yet. Ask the Operations Officer to add it.</p>");return}
        if(!x.d||!x.d.ok)throw new Error("failed");
        var d=x.d,t=new Date(d.t),tm=t.toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"}),dt=t.toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"});
        show("ok","&#10003;","TOOL CHECKED OUT",
          "<div class='name'>"+esc(d.name)+"</div><div class='code'>"+esc(d.code)+"</div>"+
          "<div class='meta'>"+esc(DIV[d.div]||d.div||"")+(d.group?" &middot; "+esc(d.group):"")+"<br>"+esc(dt)+" at "+esc(tm)+"</div>"+
          "<div class='rows'><div class='row'><b>&#10003;</b><span>Ticked on today&rsquo;s tools checklist</span></div>"+
          "<div class='row'><b>&#10003;</b><span>Marked checked out in the Operations Officer inventory</span></div></div>"+
          "<p class='small'>You can close this page.</p>");
      })
      .catch(function(){
        show("bad","&#9888;","No connection","<p class='meta'>The tool could not be checked out because the phone could not reach the system. Check the signal and try again.</p><button class='btn' id='retry'>Try again</button>");
        var b=document.getElementById("retry");if(b)b.onclick=run;
      });
  }
  run();
})();
</script>
</body>
</html>
